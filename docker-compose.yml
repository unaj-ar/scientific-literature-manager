services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-database_revision}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run only on the first start of an empty volume, in this order.
      - ./scripts/V002.sql:/docker-entrypoint-initdb.d/02-V002.sql:ro
      - ./scripts/V003.sql:/docker-entrypoint-initdb.d/03-V003.sql:ro
      - ./scripts/V004.sql:/docker-entrypoint-initdb.d/04-V004.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-database_revision}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
